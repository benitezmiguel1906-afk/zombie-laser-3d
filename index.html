<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zombie 3D: El Último Explorador</title>
  <style>
    body {
      background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px;
      height: 100vh; margin: 0; display: flex; flex-direction: column; justify-content: center;
      touch-action: none;
    }
    h1 { color: #0f0; font-size: 26px; margin-bottom: 5px; }
    .panel { background: #111; border: 1px solid #333; padding: 20px; border-radius: 15px; max-width: 400px; margin: 0 auto;}
    select { padding: 10px; font-size: 16px; border-radius: 5px; background: #333; color: #fff; width: 100%; margin-bottom: 15px; border: 1px solid #555; }
    button { padding: 15px; font-size: 18px; background: #0f0; color: #000; border: none; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
    button:hover { background: #0c0; }
    #estado { margin-top: 15px; font-size: 16px; color: #ff6a00; font-weight: bold; min-height: 40px;}
    #info { font-size: 14px; color: #0f0; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>Zombie 3D</h1>
  
  <div class="panel" id="panelInicio">
    <select id="selectorVoz"><option value="">Cargando voces...</option></select>
    <button id="btnIniciar">Iniciar Nivel 1</button>
  </div>
  
  <div id="estado" aria-live="polite">Esperando conexión...</div>
  <div id="info"></div>

  <script>
    let audioCtx;
    let zombiPadre;
    let juegoActivo = false;
    let ultimoToqueTiempo = 0;

    let zombiX = 0; 
    let zombiZ = -20; 
    
    let nivel = 1;
    let zombisEliminados = 0;
    let zombisParaPasarNivel = 2;
    let distanciaMeta = 150; 

    let balas = 6;
    let recargando = false;

    let timerMovimiento, timerRadar, timerGruñido;

    // Variables de audio
    let audioGruñido, audioMusica, audioExito, audioFallo, 
        audioGameOver, audioNivel, audioPuerta, audioDisparo, audioRecarga, 
        audioAtaqueIzq, audioAtaqueDer, audioZumbiDer;

    const btnIniciar = document.getElementById('btnIniciar');
    const estadoDiv = document.getElementById('estado');
    const infoDiv = document.getElementById('info');
    const panelInicio = document.getElementById('panelInicio');
    const selectorVoz = document.getElementById('selectorVoz');

    let vocesDisponibles = [];
    function cargarVoces() {
      vocesDisponibles = window.speechSynthesis.getVoices();
      if (vocesDisponibles.length === 0) return;
      selectorVoz.innerHTML = '';
      const vocesEspanol = vocesDisponibles.filter(voz => voz.lang.includes('es'));
      vocesEspanol.forEach((voz) => {
        const opcion = document.createElement('option');
        opcion.value = voz.name;
        opcion.textContent = `${voz.name} (${voz.lang})`;
        selectorVoz.appendChild(opcion);
      });
    }
    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = cargarVoces;
    }

    function hablar(texto, callback) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const mensaje = new SpeechSynthesisUtterance(texto);
        const vozElegida = selectorVoz.value;
        if (vozElegida) {
          const vozEncontrada = vocesDisponibles.find(v => v.name === vozElegida);
          if (vozEncontrada) mensaje.voice = vozEncontrada;
        }
        mensaje.rate = 1.2;
        if (callback) mensaje.onend = callback;
        window.speechSynthesis.speak(mensaje);
      }
    }

    async function cargarSonido(url) {
      try {
        const respuesta = await fetch(url);
        if (!respuesta.ok) throw new Error("No encontrado");
        const arrayBuffer = await respuesta.arrayBuffer();
        return await audioCtx.decodeAudioData(arrayBuffer);
      } catch (error) { return null; }
    }

    btnIniciar.addEventListener('click', async () => {
      cargarVoces();
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      zombiPadre = audioCtx.createPanner();
      zombiPadre.panningModel = 'HRTF'; 
      zombiPadre.distanceModel = 'linear'; 
      zombiPadre.refDistance = 1;
      zombiPadre.maxDistance = 30;
      zombiPadre.connect(audioCtx.destination);

      // Cargar los 11 sonidos (Usando zumbi_chegando_r para el gruñido)
      audioGruñido = await cargarSonido('zumbi_chegando_r.mp3');
      audioMusica = await cargarSonido('zumbi_som_tema_baixo_2.mp3');
      audioExito = await cargarSonido('sucesso_novo.mp3');
      audioFallo = await cargarSonido('errada_opcao_1.mp3');
      audioGameOver = await cargarSonido('game_over3xb.mp3');
      audioNivel = await cargarSonido('som_nivel_concluido.mp3');
      audioPuerta = await cargarSonido('som_porta_abrindo.mp3');
      audioDisparo = await cargarSonido('som_tiro.mp3');
      audioRecarga = await cargarSonido('arma_novo.mp3');
      audioAtaqueIzq = await cargarSonido('zumbi_ataque_l.mp3');
      audioAtaqueDer = await cargarSonido('zumbi_ataque_r.mp3');
      audioZumbiDer = await cargarSonido('zumbi_chegando_r.mp3'); // Reutilizamos este

      panelInicio.style.display = 'none';
      estadoDiv.innerText = "Cargando misión...";
      
      nivel = 1;
      zombisEliminados = 0;
      distanciaMeta = 150;
      balas = 6;
      recargando = false;

      const intro = "Año 2077. Búnker 7. Tu misión es llegar al refugio seguro a 150 metros. Sobrevive a las hordas de infectados. Nivel 1. Prepárate.";
      hablar(intro, iniciarCombate);
    });

    function iniciarCombate() {
      zombiZ = -20; 
      zombiX = (Math.random() - 0.5) * 10; 
      actualizarPosicionAudio();
      
      juegoActivo = true;
      actualizarInterfaz();
      
      iniciarMovimientoZombi();
      iniciarRadar();
      programarGruñido();
      if (audioMusica) iniciarMusica();
    }

    function actualizarInterfaz() {
      estadoDiv.innerText = `Nivel ${nivel}. Eliminados: ${zombisEliminados}/${zombisParaPasarNivel}`;
      infoDiv.innerText = `Faltan ${distanciaMeta}m para el refugio. Balas: ${balas}/6`;
    }

    function actualizarPosicionAudio() {
      zombiPadre.positionX.value = zombiX;
      zombiPadre.positionY.value = 0;
      zombiPadre.positionZ.value = zombiZ;
    }

    function iniciarMovimientoZombi() {
      clearInterval(timerMovimiento);
      timerMovimiento = setInterval(() => {
        if (!juegoActivo) return;
        
        zombiZ += 1 + (nivel * 0.4); 
        zombiX += (Math.random() - 0.5) * 5;
        
        if (zombiX > 10) zombiX = 10;
        if (zombiX < -10) zombiX = -10;
        actualizarPosicionAudio();
        
        if (zombiZ >= 0) {
          if (zombiX < 0 && audioAtaqueIzq) reproducirBuffer(audioAtaqueIzq);
          else if (audioAtaqueDer) reproducirBuffer(audioAtaqueDer);
          gameOver();
        }
      }, 1500); 
    }

    function iniciarRadar() {
      clearInterval(timerRadar);
      timerRadar = setInterval(() => {
        if (!juegoActivo) return;
        let distanciaReal = Math.abs(zombiZ).toFixed(0);
        
        if (zombiZ > -8 && zombiX > -3 && zombiX < 3) {
          hablar(`¡Zombi al centro a ${distanciaReal} metros, dispara!`);
        } else if (zombiX <= -3) {
          hablar(`Zombi a la izquierda a ${distanciaReal} metros`);
        } else if (zombiX >= 3) {
          hablar(`Zombi a la derecha a ${distanciaReal} metros`);
        }
      }, 5000); 
    }

    function programarGruñido() {
      if (!juegoActivo) return;
      if (audioGruñido) {
        const source = audioCtx.createBufferSource();
        source.buffer = audioGruñido;
        source.playbackRate.value = 0.8 + (Math.random() * 0.4);
        source.connect(zombiPadre);
        source.start();
      }
      timerGruñido = setTimeout(programarGruñido, Math.random() * 3000 + 2000);
    }

    function iniciarMusica() {
      const source = audioCtx.createBufferSource();
      source.buffer = audioMusica;
      source.loop = true;
      const gain = audioCtx.createGain();
      gain.gain.value = 0.15; 
      source.connect(gain);
      gain.connect(audioCtx.destination);
      source.start();
    }

    document.addEventListener('touchend', (e) => {
      if (!juegoActivo || recargando) return;
      const ahora = Date.now();
      if (ahora - ultimoToqueTiempo < 400) {
        disparar();
        ultimoToqueTiempo = 0; 
      } else {
        ultimoToqueTiempo = ahora; 
      }
    }, { passive: false });

    function disparar() {
      if (balas <= 0) {
        if (audioFallo) reproducirBuffer(audioFallo);
        hablar("¡Sin balas! Recargando.");
        recargar();
        return;
      }

      balas--;
      actualizarInterfaz();

      if (audioDisparo) {
        reproducirBuffer(audioDisparo);
      }
      
      if (navigator.vibrate) navigator.vibrate(80); 

      if (zombiZ > -8 && zombiX > -3.5 && zombiX < 3.5) {
        zombisEliminados++;
        if (audioExito) reproducirBuffer(audioExito);
        detenerCombateTemporal();
        
        if (zombisEliminados >= zombisParaPasarNivel) {
          subirNivel();
        } else {
          hablar(`¡Zombi eliminado!`);
          setTimeout(iniciarCombate, 2500);
        }
      } else {
        if (audioFallo) reproducirBuffer(audioFallo);
        hablar("Fallo.");
      }

      if (balas === 0) {
        recargar();
      }
    }

    function recargar() {
      recargando = true;
      if (audioRecarga) reproducirBuffer(audioRecarga);
      hablar("Recargando arma.");
      
      setTimeout(() => {
        balas = 6;
        recargando = false;
        actualizarInterfaz();
        if (audioRecarga) reproducirBuffer(audioRecarga);
        hablar("Listo para disparar.");
      }, 2500);
    }

    function reproducirBuffer(buffer) {
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start();
    }

    function detenerCombateTemporal() {
      juegoActivo = false;
      clearInterval(timerMovimiento);
      clearInterval(timerRadar);
      clearTimeout(timerGruñido);
    }

    function subirNivel() {
      if (audioNivel) reproducirBuffer(audioNivel);
      if (audioPuerta) setTimeout(() => reproducirBuffer(audioPuerta), 1500);
      
      nivel++;
      zombisEliminados = 0;
      zombisParaPasarNivel = 2 + nivel; 
      distanciaMeta -= 50; 
      
      if (distanciaMeta <= 0) {
        hablar("¡Felicidades! Has llegado al refugio. Fin de la misión.");
        estadoDiv.innerText = "¡VICTORIA!";
        return;
      }

      hablar(`¡Nivel ${nivel} superado! Abriendo puerta al siguiente sector.`);
      setTimeout(iniciarCombate, 4500);
    }

    function gameOver() {
      detenerCombateTemporal();
      if (audioGameOver) reproducirBuffer(audioGameOver);
      hablar("El zombi te ha alcanzado. Fin de la transmisión.");
      estadoDiv.innerText = "GAME OVER";
      
      setTimeout(() => {
        panelInicio.style.display = 'block';
        btnIniciar.innerText = "Reintentar";
      }, 4000);
    }
  </script>
</body>
</html>
